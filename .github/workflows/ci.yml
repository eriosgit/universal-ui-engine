name: CI

# Cinco gates que bloquean (Parte B2 del plan de ejecución de F0). El orden importa:
# `build` corre primero porque con project references de TypeScript, `typecheck` de un
# paquete downstream (backend-web, adapter-*) necesita los .d.ts ya emitidos de sus
# dependencias del workspace (@uui/core) — sin esto, `tsc -b` downstream ni siquiera
# puede resolver los tipos de @uui/core.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright (solo Chromium)
        run: pnpm --filter @uui/backend-web exec playwright install --with-deps chromium

      # Gate 1: build/typecheck. `tsc -b` desde la raíz construye TODOS los paquetes en
      # orden topológico y falla en el primer error de tipos de cualquiera.
      - name: Build + typecheck
        run: pnpm build

      # Gate 1b: el empaquetado del publicable. Va aquí, y no al final, porque un bundle
      # roto es un fallo de RELEASE: si se descubre al publicar, ya lo sufrió el usuario
      # que hizo `npx uui-scan`. Verifica también que `npm pack` incluya lo que debe.
      - name: Empaquetar uui-scan
        run: |
          pnpm build:pkg
          cd packages/uui-scan && npm pack --dry-run

      # Gate 2: lint.
      - name: Lint
        run: pnpm lint

      # Gate 3: límites de dependencia entre paquetes — la regla que de verdad impide que
      # alguien meta un `if (backend === 'uia')` (o un import de playwright) dentro de
      # packages/core. Ver .dependency-cruiser.cjs y ADR-0002.
      - name: Límites de dependencia (core no importa backend-*)
        run: pnpm deps

      # Gate 4: suite completa — incluye la suite de conformidad de @uui/core/conformance
      # ejercitada contra backend-web (el "test de contrato" real, aunque con un solo
      # backend hasta F2), los golden trees (§6, comparados por forma normalizada) y el
      # presupuesto de tokens (§3).
      - name: Tests (unitarios + conformidad + golden trees + tokens)
        run: pnpm test
